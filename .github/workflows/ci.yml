name: CI - Lint & Build Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'Apps/portfolio/**'
      - 'Apps/gamified-mandala/**'
      - 'ai-diagnosis/**'
      - 'task-manager/**'

jobs:
  portfolio-check:
    name: Portfolio Lint & Build
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'Apps/portfolio/') ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: Apps/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Apps/portfolio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Build
        run: npm run build

  mandala-check:
    name: Gamified Mandala Lint & Build
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'Apps/gamified-mandala/') ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: Apps/gamified-mandala
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Apps/gamified-mandala/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ai-diagnosis-check:
    name: AI Diagnosis Lint & Build
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'ai-diagnosis/') ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ai-diagnosis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-diagnosis/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Build
        run: npm run build
