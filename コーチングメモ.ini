# 人生を変える「自己変革」と「武器」を手に入れる
## 6ヶ月 パーソナル・コーチング

### 思考の書き換えから始まる、
### 一生モノの「成功サイクル」と「稼ぐ力」

---

# コンセプト (Philosophy)

## 「一人一人の人生には、無限の可能性がある」

どんな人であっても、今の自分を超え、
理想の未来を創り出す力を持っています。

本プログラムは、単なるスキル提供ではありません。
あなた自身の「思考」と「行動」のOSを書き換え、
自らの足で人生を切り拓く**「自走する個」**へと生まれ変わるための
**自己変革プログラム**です。

---

# なぜ「自己変革」が必要なのか？

**今のあなたの現実は、どう作られているか？**

1.  **無意識の習慣**
2.  **今の思考** (習慣によって形成される)
3.  **今の行動** (思考によって選択される)
4.  **今の現実** (行動の結果)

この順序を変えずに、小手先の行動だけ変えようとしても
すぐにリバウンドしてしまいます。
本質的に変わるには、根源である**「思考」**を見つめ直す必要があります。

![width:600](images/mindset_iceberg_jp.png)

---

# 成功のサイクル (The Success Cycle)

**「思考」が変われば、すべてが変わる。**

![width:600](images/success_cycle_jp.png)

1.  **思考を変える** (New Mindset)
    自分の思考の癖を見つめ直し、新しい視点を持つ。
2.  **行動が変わる** (New Action)
    思考が変われば、自然と選択する行動が変わる。
3.  **結果が変わる** (New Result)
    行動が変われば、得られる成果が変わる。
4.  **習慣が変わる** (New Habit)
    成果の積み重ねが、新しい習慣を作る。

このサイクルを回し続けることこそが、一生モノの財産です。

---

# 変革のメソッド (Mindset)

**自分を作り替えるための具体的ワーク**
抽象論ではなく、体系化されたワークで着実に自己変革を進めます。

*   **思考の枠組み**
    自分の思考のバイアス（枠）を知り、外す。
*   **パレートの法則 (80:20の法則)**
    成果の8割を作る「重要な2割」に集中する思考法。
*   **自分づくり (Self-Creation)**
    過去の延長線上ではない「なりたい自分」を再定義する。
*   **サクセスストーリー**
    理想の未来を鮮明に描き、そこから逆算する。

---

# 武器の獲得 (Skills)

**思考を現実に変えるための「武器」**

*   **AI活用 & プロダクト作成**
    *   AIを相棒にし、自分のアイデアを形にする技術。
    *   「消費者」から「生産者」へ。
*   **伝える技術 & 営業ノウハウ**
    *   (株)パンハウスの知見を活用した実践的営業スキル。
    *   作ったプロダクトの価値を正しく伝え、選ばれる力。
*   **キャリア & ライフデザイン**
    *   転職、副業、家計管理まで、人生の基盤を磐石に。

---

# サポート体制 (Support)

**6ヶ月間、あなたの変革に徹底伴走します。**

![width:400](images/coach_nano.png)

*    **期間: 6ヶ月**
    習慣が定着し、成果が出るのに必要な期間。
*   **週1回 オンラインセッション (MTG)**
    コーチングによる思考の整理 & コンサルティング。
*   **チャットサポート (24時間受付・翌日返信確約)**
    「わからない」で止まる時間をゼロに。
*   **教材・ノウハウ提供**
    学習動画、テキストなど、豊富なリソースを提供。

---

# ロードマップ (Schedule)

*   **Month 1: 土台構築・目標設定**
    目標設定、「自分づくり」「サクセスストーリー」ワーク。
*   **Month 2-3: 思考の変革 & インプット**
    「パレートの法則」等の習得。AI/営業ノウハウ学習開始。
*   **Month 4-5: 実践 & アウトプット**
    実際にプロダクトを作成し、人に伝えてみる。フィードバック。
*   **Month 6: 確立・自走**
    最終成果の確認。「自走」するための最終仕上げ。

