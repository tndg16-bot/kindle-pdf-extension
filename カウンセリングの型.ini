＝＝＝＝＝＝
No	項目（1〜7）	1回目でやる	2回目でやる	理由（重要ポイント）
1	ラポール形成	●	（軽く）○	信頼の9割は1回目で作る。2回目は冒頭の軽い雑談だけで十分。
2	深いヒアリング	●	△（確認程度）	課題の深掘りは1回目で徹底。2回目は復習と微調整のみでOK。
3	ニーズ喚起	●	○（追加）	“本気で変わりたい感情”は1回目で作る。2回目は再認識させるために少し補強。
4	理想とギャップの明確化	●	△	ギャップ認知が2回目の提案根拠になるため、1回目で必ず固める。
5	価値提案	✖	●	解決策の提示は必ず2回目。1回目でやると売り込み感が出て逆効果。
6	不安つぶし	△（軽く）	●	本格的に不安が出るのは提案後の2回目。金額提示の直後に必須。
7	クロージング	✖	●	契約判断は必ず2回目。1回目は絶対に売り込まず“逃げ道を塞がない”ことが大事。

＝＝＝＝＝＝
目的	
"・警戒心の解除（広告流入は警戒MAX）           
・信頼ゼロ → 信頼小 に変える                  
・本音を話せる状態をつくる  "	
	
流れ	
"① 最初の安心の一言                          
② 雑談で心理距離を縮める（2～3往復）           
③ 自己開示で「この人は敵じゃない」と理解させる     
④ 2回制カウンセリングの説明（売り込み不安排除）    
⑤ 参加理由にスムーズに入る  "	
	
成果	
"・この後のヒアリングで本音が出やすくなる         
・提案の受け入れ度が上がる                     
・2回目参加の意欲が高まる  "	
	
	
	
トークスクリプト	
① 導入（安心を与える一言）	"本日はお時間いただきありがとうございます。
AICareerLabの〇〇です！
まずはリラックスして、ざっくばらんにお話できれば嬉しいです。
最初は皆さん緊張されるので、気軽にお話しくださいね。
お名前は〇〇さんとお読みして宜しかったでしょうか？"
② 軽い雑談（2〜3往復）	"今日はお仕事の合間ですか？orお休みですか？
そんな中お時間取って頂きありがとうございます！

因みに今はどのようなお仕事をされているんですか？

本日はどういった所にご興味お持ち頂きお時間頂けましたでしょうか？"
③ 自己開示（壁を取る）	"今日は色々お私から簡単にお伝えすると、AICareerLabでは“未経験の方がAIを使って副業収入を作る”ところまでサポートしています。
今日はじっくりお話を伺えればと思っています。」

初めにAICareerLabを運営する株式会社パンハウスがどういった会社なのか
また、私自身の自己紹介踏まえて少しご説明させて頂きます。"
"④ 2回制カウンセリングの説明
（安心・期待値調整）"	"「AICareerLabのカウンセリングは2回に分かれていまして、
《1回目の今日は》
現状整理
・理想の言語化
・課題発見を中心に“お話を伺う日”です（売り込みなし）。
《2回目は》
今日伺った内容をもとに、
・最適なAI副業プラン
・ロードマップ
必要ステップを具体的にお伝えします。」
