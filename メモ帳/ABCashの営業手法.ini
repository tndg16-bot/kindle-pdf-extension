人の目的について
人間の基本的欲求
    愛されたい　大切な人だと思われたい
    認められたい　一目置かれたい
    精神的にも経済的にも安心感を持ちたい
    財産を作り、増やしたい
    夢を持ちたい

愛されたい　大切な人だと思われたい
    大好きなパートナーとの結婚資金を今からちゃんと準備できる
    育ててくれた両親に迷惑をかけずに、自立できるだけのお金を準備することができる
    子供が大きくなった時に、子供が行きたい高校や大学に通わせて上げることができる
    自分がどんなキャリアを選んでも、家族に迷惑をかけたり、路頭に迷わせるようなことが起きないようにしてあげられる

認められたい　一目置かれたい
    金融知識が豊富で、投資経験もあるなんて、本当にイケてますね
    と周囲から一目置かれる存在になれる
    子供の教育資金を今から準備する方法を学ぶことで、将来子供に尊敬される親になれる
    結婚した時に、ちゃんと資産形成してるなんて知らなかった！さすが私のパートナー！と彼女に褒めてもらえる

精神的にも経済的にも安心感を持ちたい
    収入が多少不安定になっても、老後のことを心配せずに生活していける状態にできる
    日々のトレーニングで、家計をしっかりやりくりできる状態にすることで、一人でお金のことで悩まずに生活できる
    このまま結婚しなくても、一人でしっかり生活していける見通しが立てられる
    社会情勢が目まぐるしく変わっても、資産ポートフォリオを作ることで、世の中の変化に悩まされることがなくなる

財産を作り、増やしたい
    投資や運用をしっかり学ぶことで、銀行においておくより、はるかにお金を増やせる可能性がある
    円安や円高などの社会情勢の変化を、お金を増やすチャンスに変えていくことができる
    より効果的な資産形成の方法を学ぶことで、より自分の資産を増やせる機会を得られる
    
夢を持ちたい
    将来家族で年一回は家族旅行に行ける夢が実現できる
    今からしっかり資産運用を学ぶことで、留学資金が準備できる
    50代でＦＩＲＥするという夢をより現実的なものにできる
    今からお金のことを学んでおくことで、将来フリーランスになって自由に働くという夢がかなえられる

金融教育という手段でかなえられない欲求はない！
形がないからこそどんな目的もかなえられる

