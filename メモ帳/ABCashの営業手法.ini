・女性　子供がちらっと映る（お子さんの年齢は幼児ではない）
→教育費などの将来の不安が高い可能性がある（子供のお金に刺さるチャンス）
→家計の見直しなども課題に感じているかもしれない（投資より家計管理が刺さるチャンス）

・背景が台所
→台所で受講しているということは唯一テーブルがあってちゃんと話を聞けるのがここしかない
→部屋があまり広くない可能性がある
 →収入にゆとりがないかもしれない（支払いリスク）
 →周囲がざわざわして話を集中して聞けない可能性がある（途中で中断するリスク）

・顔が険しい
→ちょっと緊張しているかもしれない
→体験会を受ける直前まで気ぜわしい状態だった可能性がある（集中して話を聞けないリスク）

