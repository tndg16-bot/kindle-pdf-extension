    ■家計管理：家計管理に課題がある
    →投資の話より家計管理で改善できる話の方が、刺さってニードを喚起できるかもしれない。
    　家計管理は具体的に何が課題何だろう。ご主人が家計の管理をしているようだが、
    　満足してない可能性もあるな。何が不満なのだろう。
    
