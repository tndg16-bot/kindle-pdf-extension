★なぜABCashに入社をして仕事をしているのか
★ABCashでの仕事を通してどんなことを実現したいのか

→仕事に熱い思いを持っていることを相手に伝える7

■信頼関係を築く
    ・家族構成（誰と同居しているのか・子供の有無）
    ・どんな家族なのか/家族の好きなところ
        ・独身でも母親と仲がいい場合、母親相談のリスクがあるため家族の状況は聞いておいた方がよい
        ・子供がいる場合は、お子さんの名前を聞いておくとよい（お子さんではなく○○ちゃんと呼んだ方がお客様が自分事化しやすい）
            ・ちなみにお名前は？　なんでそのお名前つけたんですか？　素敵ですね
    ・今のお仕事の内容/普段の働き方
        ・仕事が忙しいと「時間がない」
        ・職種から大まかな年収・働き方を想定しておく
    ・（既婚者なら）お金の管理・収支のやりくりの状況
        ・旦那様に相談、とならないか事前アンケートを基に決済権については改めて確認
    ・将来やりたいこと／夢
        ・欲求を喚起する上でフックになる可能性が高いため
        ・お子さんへの教育方針なども聞いておいてもよい（将来にかかるお金を把握できる）
    ・今ある不安／将来の心配
        ・具体的に本人が感じている今の不安や不満は欲求を引き起こすうえで重要
    ・体験会に申し込んだきっかけ／投資に興味を持った理由・目的
        ・NISAに興味があった、という理由だけではなく、なぜNISAに興味があったのか、なぜ投資に目が向いたのか、というとこをも深堀して聞いておいた方がよい。
        ・お金を増やして、何に使いたいのか・何に備えたいのか・誰のためのお金なのか（欲求に繋がる部分）
        ・他社比較の可能性もあるため、他にもこういう体験会を受けているかは確認するとよい
    ・体験会で聞いておきたいこと
        ・ここはお客様の金融リテラシーを確認するためにどんなことを知りたいかを把握しておく

ヒアリングのポイント→枕詞を試用する
        ヒアリングに入る前の枕詞
        ・本日はせっかくお時間をいただいたので、○○さんにあった体験会をさせていただきたい。と思ってまして、
        　最初に○○さんのこともお伺いさせていただきたいのですが、少しヒアリングさせていただいてもよろしいですか？
        　ヒアリングに合意を取る
        
        ・家計を誰が握っているのか聞きたいときの枕詞
            ・普段例えばご家族でお買い物に行くときは、ご主人が全部お支払いされたりするんですか？
                ・いきなり「家計を握っているのは誰？」と直接聞くと失礼にあたるため、想定されるシーンを提示
                ・どんな場合に誰がどんな風にお金を払うのか、間接に聞くことができる
        ・投資をしたい目的を聞くときの枕詞
            ・私の場合～だったんですが、○○様は投資をはじめたきっかけはなんだったの？
ヒアリングを通じて商談全体の構成を予め想定しておく
    不安や不満につなげられそうな現状の課題
    ニード喚起に繋がりそうなエピソード
