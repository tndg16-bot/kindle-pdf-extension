オープニングの目的
    目的：現状の問題点への気づきを与える
    ある状況でたいていの人が抱える問題点を指摘する
    一般論を元に不満を引き出す
    
    オープニングトーク
    セールス：最近、物価高ってよく新聞やテレビで目にすることが増えましたよね。
    　　　　　体験会を受けてくださる方からもよく「物価が上がってしまって生活が大変になった」というお話を伺う機会が増えてきたんですが、
    　　　　　○○さんもどうですか？物価が上がったなって肌で感じることってありますか？
    
    お客様：あ、そうですね。スーパーに行くと野菜とか日用品の値段が上がったなって感じることがよくあります。（YES）
    
    セールス：ですよね、やっぱりそう感じられますよね。ただ、物価が今がピークの状態で、これ以上は上がらないって、分かっていたらまだいいと思うのですが、
    　　　　　実際○○さんどうですか？これ以上物価は上がらないって、自信を持って言えそうですか？

    お客様：いえ、、、まだ上がる可能性もあるなって思います（ＹＥＳ）

    セールス：そうですよね、上がる可能性がないとはまだまだ言い切れないですよね。
    　　　　　もちろん物価が上がっても物価の上昇に伴って、お給料が上がっていけば問題ないと思うんです。
    　　　　　でもどうです、○○さん正直お給料って、今、上がっている実感ありますか？

    お客様：ないですね。残念ながら給与は増えてないですね。（ＹＥＳ）

    セールス：そうですよね。物価は上がるけれど、残念ながら私たちの給与はそれと同じようにはあがっていかない。
